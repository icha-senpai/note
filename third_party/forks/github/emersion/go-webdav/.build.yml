image: alpine/edge
packages:
  - go
sources:
  - https://github.com/icha-senpai/note/third_party/forks/github/emersion/go-webdav
tasks:
  - build: |
      cd go-webdav
      go build -race -v ./...
  - test: |
      cd go-webdav
      go test -race -v ./...
  - gofmt: |
      cd go-webdav
      test -z $(gofmt -l .)

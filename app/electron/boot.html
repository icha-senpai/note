<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <style>
        html {
            overflow: hidden;
            height: 100%;
        }

        body {
            height: 100%;
            margin: 0;
            background: #1e1e1e;
            font-size: 12px;
            font-family: "Helvetica Neue", "Luxi Sans", "DejaVu Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Segoe UI Symbol", "Android Emoji", "EmojiSymbols";
        }

        #bg {
            width: 100%;
            display: flex;
            justify-content: space-around;
            height: 100%;
        }

        #bootLogo {
            width: 24vh;
            height: 24vh;
            align-self: center;
            object-fit: contain;
        }

        #bootLogo {
            opacity: 0;
            transform: scale(0.94);
        }

        #bootLogo.started {
            animation: bootLogoForm 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes bootLogoForm {
            0% {
                opacity: 0;
                transform: scale(0.94);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Bottom progress area with safe-area space for mobile gesture bars. */
        #progressWrap {
            position: absolute;
            bottom: env(safe-area-inset-bottom);
            width: 100%;
            padding-bottom: env(safe-area-inset-bottom);
        }

        #progressTrack {
            position: absolute;
            height: 2px;
            background-color: #2a2c2f;
            width: 100%;
            top: 0;
        }

        #progress {
            position: absolute;
            height: 2px;
            background-color: #3b3e43;
            box-shadow: 0 0 8px rgba(59, 62, 67, 0.6);
            transition: width 0.6s cubic-bezier(0, 0, 0.2, 1);
            top: 0;
            width: 0;
        }

        #details {
            color: #9aa0a6;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
            padding: 8px;
            height: 16px;
            line-height: 16px;
        }
    </style>
</head>
<body>
<div id="bg">
    <img id="bootLogo" src="icon.png" alt="">
</div>
<div id="progressWrap">
    <div id="progressTrack"></div>
    <div id="progress"></div>
    <div id="details"></div>
</div>
<script>
    const getSearch = (key) => {
        if (window.location.search.indexOf('?') === -1) {
            return ''
        }
        let value = ''
        const data = window.location.search.split('?')[1].split('&')
        data.find(item => {
            const keyValue = item.split('=')
            if (keyValue[0] === key) {
                value = keyValue[1]
                return true
            }
        })
        return value
    }
    (async () => {
        const v = getSearch('v')
        const port = getSearch('port') || '6806'
        const progressEl = document.getElementById('progress')
        const detailsEl = document.getElementById('details')
        detailsEl.textContent = "v" + v + ' Booting kernel...'

        // Random base progress (15-25); fill to this value smoothly while waiting for kernel progress.
        const baseProgress = 15 + Math.random() * 10

        // Keep displayed progress monotonic so early kernel values below the base do not rewind the bar.
        let currentDisplay = 0
        const bootLogo = document.getElementById("bootLogo")
        let animStart = 0
        const setProgress = (target) => {
            if (target > currentDisplay) {
                currentDisplay = target
                progressEl.style.width = target + '%'
                if (bootLogo && !bootLogo.classList.contains("started") && currentDisplay >= 15) {
                    bootLogo.classList.add("started")
                    animStart = Date.now()
                }
            }
        }
        // Smoothly fill to the random base after two frames so the browser renders width: 0 first.
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                setProgress(baseProgress)
            })
        })

        let progressing = false
        const subscribe = () => {
            const es = new EventSource('http://127.0.0.1:' + port + '/api/system/bootProgressSSE')
            es.onmessage = (event) => {
                const progressData = JSON.parse(event.data)
                // Map kernel progress into the baseProgress-100 range and continue increasing from the current display.
                const display = baseProgress + progressData.progress * (100 - baseProgress) / 100
                setProgress(display)
                detailsEl.textContent = progressData.details
                if (progressData.progress >= 100) {
                    progressing = true
                    es.close()
                    // Once the kernel finishes, fast-forward the remaining animation to the final state.
                    if (animStart > 0 && bootLogo) {
                        const animTotalMs = 800
                        const elapsed = Date.now() - animStart
                        const remaining = animTotalMs - elapsed
                        if (remaining > 0) {
                            // Use a very short finish window (200ms) to fast-forward to the final state.
                            const rate = remaining / 200
                            bootLogo.getAnimations().forEach((a) => {
                                a.playbackRate = rate
                            })
                        }
                    }
                }
            }
            es.onerror = () => {
                es.close()
                // The HTTP server may not be ready early in kernel boot, and EventSource retries slowly.
                // Reconnect quickly here to match the old polling behavior.
                if (!progressing) {
                    setTimeout(subscribe, 100)
                }
            }
        }
        subscribe()
    })()
</script>
</body>
</html>

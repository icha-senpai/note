allowBuilds:
  '@parcel/watcher': true
  electron: true
  electron-winstaller: true
  esbuild: true
blockExoticSubdeps: false
minimumReleaseAgeExclude:
  - electron@42.5.0
  - app-builder-lib@26.15.6
  - dmg-builder@26.15.6
  - electron-builder-squirrel-windows@26.15.6
  - electron-builder@26.15.6
overrides:
  # Pin 4.0.3 because app-builder-lib@26.15.x reads ElectronDownloadCacheMode.ReadWrite from @electron/get.
  # That export only exists in @electron/get@4.x; 3.x uses CacheMode and 5.x arrives through electron@42 with an incompatible API.
  # Keeping one version avoids fragmented installs and fixes electron-builder "Cannot read properties of undefined (reading 'ReadWrite')" failures.
  '@electron/get': 4.0.3

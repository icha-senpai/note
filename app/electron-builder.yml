productName: "Scribli"
appId: "app.scribli.desktop"
publish: null
asar: false
compression: "normal"
copyright: "Copyright (c) 2020-present Scribli"
artifactName: "scribli-${version}-${os}.${ext}"
extraMetadata:
  main: "electron/main.js"
directories:
  output: "build"
files:
  - "electron"
afterPack: "./scripts/afterPack.js"
extraFiles:
  - from: "../LICENSE"
    to: "LICENSE"
win:
  icon: "src/assets/icon.ico"
  extraResources:
    - from: "kernel"
      to: "kernel"
  requestedExecutionLevel: "asInvoker"
  signtoolOptions:
    signingHashAlgorithms: [ 'sha256' ]
    rfc3161TimeStampServer: "http://timestamp.acs.microsoft.com/"
  target:
    - target: "nsis"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  deleteAppDataOnUninstall: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Scribli"
  license: "../LICENSE"
  include: "nsis/installer.nsh"
  warningsAsErrors: false
  installerSidebar: "nsis/installerSidebar.bmp"
  uninstallerSidebar: "nsis/uninstallerSidebar.bmp"

extraResources:
  - from: "changelogs"
    to: "changelogs"
  - from: "stage"
    to: "stage"
  - from: "appearance/boot"
    to: "appearance/boot"
    filter: "!**/{.DS_Store}"
  - from: "appearance/icons"
    to: "appearance/icons"
    filter: "!**/{.DS_Store}"
  - from: "appearance/langs"
    to: "appearance/langs"
    filter: "!**/{.DS_Store}"
  - from: "appearance/emojis"
    to: "appearance/emojis"
    filter: "!**/{.DS_Store}"
  - from: "appearance/themes/midnight"
    to: "appearance/themes/midnight"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/themes/daylight"
    to: "appearance/themes/daylight"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/fonts"
    to: "appearance/fonts"
    filter: "!**/{.DS_Store}"
  - from: "pandoc/pandoc-windows-amd64.zip"
    to: "pandoc.zip"
  - from: "pandoc/pandoc-resources"
    to: "pandoc-resources"
    filter: "!**/{.DS_Store}"

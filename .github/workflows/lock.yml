name: Lock closed issues and PRs

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at 00:00 UTC.
  workflow_dispatch: # Allow manual trigger.

permissions:
  issues: write
  pull-requests: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@v6
        with:
          # Do not set issue-comment / pr-comment: comments notify historical participants and send email.
          # The lock policy is documented in the Issue Process section of CONTRIBUTING.
          issue-inactive-days: "30"
          issue-lock-reason: "resolved"
          pr-inactive-days: "30"
          pr-lock-reason: "resolved"
